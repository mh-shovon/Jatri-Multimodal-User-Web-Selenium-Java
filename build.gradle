plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Source: https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-java
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.44.0'

    // Source: https://mvnrepository.com/artifact/org.testng/testng
    testImplementation 'org.testng:testng:7.12.0'

    // dummy text generator
    // Source: https://mvnrepository.com/artifact/com.thedeanda/lorem
    testImplementation 'com.thedeanda:lorem:2.1'

    // extent reports
    // https://mvnrepository.com/artifact/com.aventstack/extentreports
    testImplementation 'com.aventstack:extentreports:5.1.1'

    // FileUtils.copyFile [screenShot]
    testImplementation 'commons-io:commons-io:2.11.0'

    // https://mvnrepository.com/artifact/org.mongodb/mongo-java-driver
    testImplementation 'org.mongodb:mongo-java-driver:3.12.14'

    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useTestNG()
    systemProperty "file.encoding", "UTF-8" //for bangla and other non-english characters
}